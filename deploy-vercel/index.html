        </svg>
      </div>
    </div>
    <button type="button" class="intro-skip" id="skipBtn">تخطّي</button>
  </div>

  <!-- ===== النموذج ===== -->
  <main class="page" id="page">

    <header class="head">
      <div class="head-logo">

          <path fill="#e7ded5" d="M114.98,162.89c-4.21-2.76-8.85-5.03-13.56-6.82-7.91-3.01-16.05-5.38-24.04-8.17-5.38-1.88-10.65-4.07-14.92-8.04-2.96-2.75-4.69-6.13-5-10.18-.17-2.18.79-3.02,2.81-2.11,1.62.72,3.07,1.88,4.44,3.04,2.45,2.07,4.65,4.44,7.18,6.4,4.02,3.12,8.28,3.14,12.1-.2,2.1-1.82,3.62-4.31,5.36-6.54.39-.49.61-1.12.94-1.74,3.52,1.8,6.3,4.16,8.56,7.16,1.53,2.04,2.08,1.99,3.16-.35,3.29-7.13,5.55-14.57,6.58-22.37.72-5.45-.97-9.96-5.54-13.14-2.47-1.73-5.05-3.32-7.7-4.76-3.51-1.91-7.22-3.43-10.67-5.43-4.02-2.34-6.82-5.81-7.8-10.47-.35-1.65-.28-3.39-.4-5.14-4.97,8.94-6.27,17.31,2.88,24.8-1.58,4.56-3.34,8.94-4.59,13.45-1.26,4.56.31,8.03,4.27,10.62,1.37.89,2.84,1.62,4.3,2.35,1.22.61,2.49,1.13,3.85,1.74-.32.27-.48.45-.68.58-3.65,2.34-7.45,2.13-11.24-.93-2.68-2.17-5.08-4.67-7.66-6.97-4.26-3.8-7.03-3.34-9.33,1.91-1.71,3.92-3.14,8-4.25,12.13-1.34,4.96-.57,9.77,2.6,13.97,2.65,3.54,6.25,5.98,10.29,7.53,7.04,2.72,14.19,5.19,21.33,7.63,7.39,2.52,14.86,4.81,21.51,9.06,7.47,4.77,12.05,11.42,12.43,20.38.18,4.23-.54,8.5-.83,12.43.07-.07.19-.24.28-.43,2.72-6.07,4.6-12.36,4.65-19.07.07-9.37-3.42-17.13-11.31-22.32ZM94.43,106.85c8.35,2.95,12.11,10.7,9.45,19.76-2.19-2.09-4.05-4.56-6.52-6.02-2.81-1.68-3.45-3.35-2.73-6.47.52-2.31-.1-4.88-.2-7.27ZM78.69,107.17c2.05-1.16,3.95-.69,5.69.64,2.72,2.08,4.27,4.99,5.52,8.18-4.63-.43-10.46-5.03-11.21-8.82Z"></path>

        </svg>
      </div>
      <div class="head-brand">ملتقى ماهر الإلكتروني</div>
      <p class="head-desc">يسرّنا انضمامكم إلى ملتقى ماهر الإلكتروني، يرجى تعبئة البيانات التالية لإتمام التسجيل</p>
    </header>

    <form class="card" id="form" novalidate>

      <div class="card-top">
        <div class="card-title">بيانات التسجيل</div>
        <div class="progress-wrap">
          <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
          <div class="progress-num" id="progressNum">0%</div>
        </div>
      </div>

      <div class="grid">

        <div class="field">
          <label for="firstName">الاسم الشخصي</label>
          <div class="input-wrap">
            <input id="firstName" name="firstName" type="text" placeholder="اكتب اسمك الأول" autocomplete="given-name">
            <span class="check">✓</span>
          </div>
        </div>

        <div class="field">
          <label for="lastName">اسم العائلة</label>
          <div class="input-wrap">
            <input id="lastName" name="lastName" type="text" placeholder="اكتب اسم العائلة" autocomplete="family-name">
            <span class="check">✓</span>
          </div>
        </div>

        <div class="field">
          <label for="age">العمر</label>
          <div class="input-wrap">
            <input id="age" name="age" type="text" inputmode="numeric" placeholder="أدخل عمرك">
            <span class="check">✓</span>
          </div>
        </div>

        <div class="field">
          <label>الجنس</label>
          <div class="gender">
            <button type="button" class="gender-btn" data-gender="ذكر">ذكر</button>
            <button type="button" class="gender-btn" data-gender="أنثى">أنثى</button>
          </div>
          <input type="hidden" id="gender" name="gender" value="">
        </div>

        <div class="field">
          <label for="phone">رقم الهاتف</label>
          <div class="input-wrap">
            <input id="phone" name="phone" type="tel" inputmode="tel" dir="ltr" class="ltr" placeholder="+966 5X XXX XXXX" autocomplete="tel">
            <span class="check">✓</span>
          </div>
        </div>

        <div class="field">
          <label for="email">البريد الإلكتروني</label>
          <div class="input-wrap">
            <input id="email" name="email" type="email" inputmode="email" dir="ltr" class="ltr" placeholder="name@example.com" autocomplete="email">
            <span class="check">✓</span>
          </div>
        </div>

        <div class="field">
          <label for="country">الدولة</label>
          <div class="input-wrap">
            <select id="country" name="country">
              <option value="" disabled selected>اختر الدولة</option>
              <option value="السعودية">السعودية</option>
              <option value="الإمارات">الإمارات</option>
              <option value="قطر">قطر</option>
              <option value="الكويت">الكويت</option>
              <option value="البحرين">البحرين</option>
              <option value="عُمان">عُمان</option>
              <option value="مصر">مصر</option>
              <option value="الأردن">الأردن</option>
              <option value="المغرب">المغرب</option>
            </select>
            <span class="caret">▾</span>
          </div>
        </div>

        <div class="field">
          <label for="city">المدينة</label>
          <div class="input-wrap">
            <input id="city" name="city" type="text" placeholder="أدخل مدينتك">
            <span class="check">✓</span>
          </div>
        </div>

        <div class="field">
          <label for="program">البرنامج</label>
          <div class="input-wrap">
            <select id="program" name="program">
              <option value="" disabled selected>اختر البرنامج</option>
              <option value="فتية">فتية</option>
              <option value="المراقي">المراقي</option>
              <option value="بناء المقرئ">بناء المقرئ</option>
            </select>
            <span class="caret">▾</span>
          </div>
        </div>

        <div class="field">
          <label for="batch">الدفعة</label>
          <div class="input-wrap">
            <select id="batch" name="batch">
              <option value="" disabled selected>اختر الدفعة</option>
              <option value="الدفعة الأولى">الدفعة الأولى</option>
              <option value="الدفعة الثانية">الدفعة الثانية</option>
              <option value="الدفعة الثالثة">الدفعة الثالثة</option>
            </select>
            <span class="caret">▾</span>
          </div>
        </div>

      </div>

      <label class="pledge" id="pledgeLabel">
        <input type="checkbox" id="pledge" name="pledge">
        <span class="pledge-box" aria-hidden="true"><span class="pledge-tick">✓</span></span>
        <span class="pledge-text">أتعهد بالالتزام بأنظمة الملتقى، والمشاركة الجادة في الأنشطة، والمحافظة على أخلاقيات المنافسة.</span>
      </label>

      <p class="form-error" id="formError"></p>
      <button type="submit" class="submit" id="submitBtn" disabled>إرسال الطلب</button>

    </form>
  </main>

  <!-- ===== شاشة النجاح ===== -->
  <div class="success" id="success" hidden>
    <div class="success-inner">
      <svg viewBox="0 0 120 120" class="success-svg">
        <circle cx="60" cy="60" r="52" fill="none" stroke="rgba(231,215,242,0.16)" stroke-width="4"></circle>
        <circle class="s-circle" cx="60" cy="60" r="52" fill="none" stroke="#e7d7f2" stroke-width="4" stroke-linecap="round" stroke-dasharray="327" stroke-dashoffset="327" transform="rotate(-90 60 60)"></circle>
        <path class="s-check" d="M38 61 L53 76 L83 44" fill="none" stroke="#e7d7f2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="70" stroke-dashoffset="70"></path>
      </svg>
      <div class="success-title">تم إرسال بياناتكم بنجاح</div>
      <p class="success-desc">شكرًا لانضمامكم إلى ملتقى ماهر الإلكتروني</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
