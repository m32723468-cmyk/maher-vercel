<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة التحكم — مسجّلو ملتقى ماهر</title>
<style>
  :root{
    --v-900:#22143d; --v-800:#2f1a4d; --v-700:#46286f; --v-600:#552e93; --v-500:#6b45a8; --v-400:#8a5fc7;
    --lilac:#e7d7f2; --lilac-soft:rgba(231,215,242,.72); --lilac-dim:rgba(231,215,242,.5);
    --line:rgba(231,215,242,.16); --glass:rgba(231,215,242,.06);
    --male:#7fb3ff; --female:#f3a9d0;
    --head:'Segoe UI',Tahoma,system-ui,-apple-system,'Noto Sans Arabic',sans-serif;
    --body:'Segoe UI',Tahoma,system-ui,-apple-system,'Noto Sans Arabic',sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    font-family:var(--body); color:var(--lilac); min-height:100vh;
    background:radial-gradient(90% 60% at 85% -5%,rgba(138,95,199,.4),transparent 55%),
      radial-gradient(80% 55% at 5% 105%,rgba(107,69,168,.35),transparent 55%),
      linear-gradient(160deg,#2f1a4d,#22143d);
    background-attachment:fixed;
  }
  ::selection{ background:rgba(231,215,242,.3); }
  .wrap{ max-width:1180px; margin:0 auto; padding:clamp(20px,4vw,40px) clamp(14px,3vw,32px) 70px; }

  /* الترويسة */
  .top{ display:flex; align-items:center; gap:16px; flex-wrap:wrap; padding-bottom:22px; border-bottom:1px solid var(--line); }
  .top .logo{ width:52px; height:52px; flex:none; }
  .top .logo svg path{ fill:var(--lilac); }
  .top h1{ font-family:var(--head); font-size:clamp(22px,4vw,30px); margin:0; color:#fff; }
  .top .sub{ font-size:12.5px; color:var(--lilac-dim); }
  .top .spacer{ flex:1; }
  .btn{ font-family:var(--body); font-size:13.5px; cursor:pointer; border-radius:12px 3px 12px 3px;
    padding:11px 18px; border:1px solid var(--line); background:var(--glass); color:var(--lilac);
    transition:all .2s ease; display:inline-flex; align-items:center; gap:7px; }
  .btn:hover{ border-color:var(--v-400); }
  .btn.solid{ background:var(--lilac); color:var(--v-600); border-color:var(--lilac); font-weight:700; }

  /* الإحصائيات */
  .stats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; margin:24px 0; }
  .stat{ background:var(--glass); border:1px solid var(--line); border-radius:18px 5px 18px 5px; padding:18px 20px; }
  .stat .n{ font-family:var(--head); font-size:34px; color:#fff; line-height:1; }
  .stat .l{ font-size:12.5px; color:var(--lilac-dim); margin-top:8px; }
  .stat.male .n{ color:var(--male); } .stat.female .n{ color:var(--female); }
  .bar{ height:6px; border-radius:99px; background:rgba(231,215,242,.12); margin-top:12px; overflow:hidden; display:flex; }
  .bar i{ display:block; height:100%; }
  .bar .m{ background:var(--male); } .bar .f{ background:var(--female); }

  /* أدوات التصفية */
  .toolbar{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:18px; }
  .tabs{ display:inline-flex; background:var(--glass); border:1px solid var(--line); border-radius:14px; padding:5px; gap:4px; }
  .tab{ font-family:var(--body); font-size:13.5px; cursor:pointer; border:none; background:transparent;
    color:var(--lilac-soft); padding:9px 18px; border-radius:10px; transition:all .2s ease; }
  .tab.on{ background:var(--lilac); color:var(--v-600); font-weight:700; }
  .tab .c{ font-size:11.5px; opacity:.7; margin-inline-start:5px; }
  .search{ position:relative; flex:1; min-width:200px; }
  .search input{ width:100%; padding:12px 16px; border-radius:12px; background:var(--glass);
    border:1px solid var(--line); color:#fff; font-family:inherit; font-size:14px; outline:none; }
  .search input::placeholder{ color:var(--lilac-dim); }
  .search input:focus{ border-color:var(--v-400); }
  .filters select{ padding:12px 14px; border-radius:12px; background:var(--glass); border:1px solid var(--line);
    color:var(--lilac); font-family:inherit; font-size:13.5px; outline:none; cursor:pointer; }
  .filters select option{ background:var(--v-800); color:var(--lilac); }

  /* الجدول */
  .tablewrap{ background:var(--glass); border:1px solid var(--line); border-radius:20px 6px 20px 6px; overflow:hidden; }
  table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  thead th{ background:rgba(231,215,242,.08); color:var(--lilac-soft); font-weight:400; text-align:right;
    padding:14px 16px; white-space:nowrap; border-bottom:1px solid var(--line); font-family:var(--head); }
  tbody td{ padding:13px 16px; border-bottom:1px solid rgba(231,215,242,.08); color:var(--lilac); }
  tbody tr:last-child td{ border-bottom:0; }
  tbody tr:hover{ background:rgba(231,215,242,.04); }
  .g-pill{ display:inline-flex; align-items:center; gap:6px; font-size:12px; padding:5px 11px; border-radius:99px; }
  .g-pill.m{ background:rgba(127,179,255,.15); color:var(--male); }
  .g-pill.f{ background:rgba(243,169,208,.15); color:var(--female); }
  .g-pill .d{ width:6px; height:6px; border-radius:50%; background:currentColor; }
  td.ltr{ direction:ltr; text-align:right; font-size:12.5px; color:var(--lilac-soft); }
  .empty{ text-align:center; padding:60px 20px; color:var(--lilac-dim); }
  .empty .big{ font-family:var(--head); font-size:20px; color:var(--lilac-soft); margin-bottom:6px; }

  /* إضافات: إحصاءات البرامج، نسخ، حذف، تنبيه */
  .prog-stats{ display:flex; flex-wrap:wrap; gap:10px; margin:0 0 18px; }
  .prog-chip{ display:flex; align-items:center; gap:8px; background:var(--glass); border:1px solid var(--line);
    border-radius:12px 3px 12px 3px; padding:9px 14px; font-size:13px; }
  .prog-chip b{ color:#fff; }
  .prog-chip .num{ color:var(--v-400); font-weight:700; }
  td.copy{ cursor:pointer; }
  td.copy:hover{ color:#fff; text-decoration:underline; }
  .del-btn{ background:transparent; border:1px solid var(--line); color:var(--female); cursor:pointer;
    border-radius:8px; padding:5px 11px; font-size:12px; font-family:var(--body); transition:all .2s ease; }
  .del-btn:hover{ background:rgba(243,169,208,.15); border-color:var(--female); }
  .toast{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); opacity:0;
    background:var(--lilac); color:var(--v-700); padding:11px 20px; border-radius:12px; font-size:13.5px;
    font-weight:700; transition:all .3s ease; z-index:80; pointer-events:none; box-shadow:0 10px 30px rgba(0,0,0,.3); }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* شاشة المفتاح */
  .gate{ position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(120% 130% at 50% 40%,#4d2c7e,#22143d); padding:20px; }
  .gate[hidden]{ display:none; }
  .gate-card{ width:100%; max-width:380px; background:linear-gradient(160deg,rgba(231,215,242,.12),rgba(231,215,242,.05));
    border:1px solid rgba(231,215,242,.2); border-radius:26px 8px 26px 8px; padding:34px 30px; text-align:center;
    backdrop-filter:blur(20px); }
  .gate-card h2{ font-family:var(--head); font-size:24px; margin:14px 0 6px; color:#fff; }
  .gate-card p{ font-size:13px; color:var(--lilac-dim); margin:0 0 22px; }
  .gate-card .logo{ width:64px; height:64px; margin:0 auto; }
  .gate-card .logo svg path{ fill:var(--lilac); }
  .gate-card input{ width:100%; padding:14px 16px; border-radius:14px; background:rgba(231,215,242,.06);
    border:1px solid rgba(231,215,242,.2); color:#fff; font-family:inherit; font-size:15px; text-align:center;
    outline:none; margin-bottom:14px; }
  .gate-card input:focus{ border-color:var(--lilac); }
  .gate-card button{ width:100%; padding:15px; border:none; border-radius:14px; cursor:pointer;
    font-family:var(--head); font-size:16px; font-weight:700; color:var(--v-600);
    background:linear-gradient(180deg,#f3e9fb,#e7d7f2); }
  .gate-err{ color:#f0a9c8; font-size:12.5px; min-height:16px; margin-bottom:8px; }
  .demo-note{ display:inline-block; margin-top:10px; font-size:11.5px; color:var(--lilac-dim);
    background:var(--glass); border:1px solid var(--line); border-radius:8px; padding:6px 12px; }

  @media (max-width:680px){
    .hide-sm{ display:none; }
    thead th, tbody td{ padding:11px 10px; }
  }
</style>
</head>
<body>

    <h2>لوحة التحكم</h2>
    <p>أدخل كود الدخول للاطّلاع على المسجّلين</p>
    <div class="gate-err" id="gateErr"></div>
    <input id="keyInput" type="password" placeholder="كود الدخول" autocomplete="off">
    <button id="keyBtn">دخول</button>
  </div>
</div>

  <div class="top">

    <div>
      <h1>مسجّلو الملتقى</h1>
      <div class="sub">لوحة تحكم فريق ملتقى ماهر الإلكتروني</div>
    </div>
    <div class="spacer"></div>
    <button class="btn" id="refreshBtn">↻ تحديث</button>
    <button class="btn solid" id="exportBtn">⇩ تصدير Excel/CSV</button>
  </div>

  <div class="stats">
    <div class="stat"><div class="n" id="stTotal">0</div><div class="l">إجمالي المسجّلين</div>
      <div class="bar"><i class="m" id="barM" style="width:50%"></i><i class="f" id="barF" style="width:50%"></i></div>
    </div>
    <div class="stat male"><div class="n" id="stMale">0</div><div class="l">الذكور</div></div>
    <div class="stat female"><div class="n" id="stFemale">0</div><div class="l">الإناث</div></div>
    <div class="stat"><div class="n" id="stToday">0</div><div class="l">تسجيلات اليوم</div></div>
  </div>

  <div class="prog-stats" id="progStats"></div>

  <div class="toolbar">
    <div class="tabs">
      <button class="tab on" data-g="all">الكل <span class="c" id="cAll">0</span></button>
      <button class="tab" data-g="ذكر">ذكور <span class="c" id="cMale">0</span></button>
      <button class="tab" data-g="أنثى">إناث <span class="c" id="cFemale">0</span></button>
    </div>
    <div class="filters">
      <select id="programFilter">
        <option value="">كل البرامج</option>
        <option value="فتية">فتية</option>
        <option value="المراقي">المراقي</option>
        <option value="بناء المقرئ">بناء المقرئ</option>
      </select>
      <select id="batchFilter">
        <option value="">كل الدفعات</option>
        <option value="الدفعة الأولى">الدفعة الأولى</option>
        <option value="الدفعة الثانية">الدفعة الثانية</option>
        <option value="الدفعة الثالثة">الدفعة الثالثة</option>
      </select>
    </div>
    <div class="search"><input id="searchInput" type="search" placeholder="بحث بالاسم أو البريد أو الهاتف أو المدينة…"></div>
  </div>

  <div class="tablewrap">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>الاسم الكامل</th>
          <th>الجنس</th>
          <th class="hide-sm">العمر</th>
          <th class="hide-sm">البرنامج</th>
          <th class="hide-sm">الدفعة</th>
          <th class="hide-sm">الدولة / المدينة</th>
          <th>الهاتف</th>
          <th class="hide-sm">البريد</th>
          <th class="hide-sm">التاريخ</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty" id="emptyState" hidden>
      <div class="big">لا توجد نتائج</div>
      <div>لا يوجد مسجّلون مطابقون لهذا التصفية بعد.</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   لوحة تحكم مسجّلي ملتقى ماهر
   - تتصل بـ GET /api/registrations (نفس الخادم) عبر مفتاح الإدارة.
   - الفلترة (ذكور/إناث)، البحث، التصدير CSV — كلها تعمل في المتصفح.
   - إن تعذّر الاتصال بالخادم يعرض بيانات تجريبية للمعاينة.
   ============================================================ */
/* ============ الإعدادات (عدّلها عند النشر) ============ */
// كود الدخول للوحة — يدخل به فريقك
const ACCESS_CODE = 'maher14*2-=sd';
// عنوان الخادم: اتركه '' إذا كانت اللوحة على نفس خادم الـAPI،
// أو ضع رابط خادمك، مثل: 'https://api.maher.com'
const API_BASE = '';
// مفتاح الـAPI (ADMIN_KEY في .env) — يُملأ عند النشر إن لزم
const ADMIN_KEY = 'maher14*2-=sd';
/* ==================================================== */

const API = API_BASE + '/api/registrations';
let ALL = [];
let filterGender = 'all';

const $ = (id) => document.getElementById(id);

/* --- بيانات تجريبية للمعاينة بدون خادم --- */
const DEMO = [
  { id:8, first_name:'سارة', last_name:'الأحمد', age:24, gender:'أنثى', phone:'+966501112233', email:'sara@example.com', country:'السعودية', city:'الرياض', program:'المراقي', batch:'الدفعة الثانية', created_at:new Date().toISOString() },
  { id:7, first_name:'ماهر', last_name:'العبدالله', age:29, gender:'ذكر', phone:'+966502223344', email:'maher@example.com', country:'السعودية', city:'جدة', program:'فتية', batch:'الدفعة الأولى', created_at:new Date().toISOString() },
  { id:6, first_name:'ليلى', last_name:'حسن', age:21, gender:'أنثى', phone:'+201002223344', email:'layla@example.com', country:'مصر', city:'القاهرة', program:'بناء المقرئ', batch:'الدفعة الأولى', created_at:'2026-07-27T10:00:00Z' },
  { id:5, first_name:'يوسف', last_name:'الطيب', age:33, gender:'ذكر', phone:'+212600112233', email:'youssef@example.com', country:'المغرب', city:'الرباط', program:'المراقي', batch:'الدفعة الثالثة', created_at:'2026-07-26T09:00:00Z' },
  { id:4, first_name:'نور', last_name:'الكواري', age:19, gender:'أنثى', phone:'+974501234', email:'noor@example.com', country:'قطر', city:'الدوحة', program:'فتية', batch:'الدفعة الثانية', created_at:'2026-07-25T14:00:00Z' },
  { id:3, first_name:'عبدالله', last_name:'المطيري', age:27, gender:'ذكر', phone:'+965999888', email:'abdullah@example.com', country:'الكويت', city:'حولي', program:'بناء المقرئ', batch:'الدفعة الأولى', created_at:'2026-07-24T14:00:00Z' },
];

/* --- البوابة: كود الدخول --- */
$('keyBtn').addEventListener('click', enter);
$('keyInput').addEventListener('keydown', (e)=>{ if(e.key==='Enter') enter(); });
function enter(){
  const code = $('keyInput').value;
  if (code !== ACCESS_CODE){
    $('gateErr').textContent = 'كود الدخول غير صحيح';
    $('keyInput').value = '';
    return;
  }
  $('gateErr').textContent = '';
  sessionStorage.setItem('maherAuthed', '1');
  $('gate').hidden = true;
  load();
}
// لو سبق الدخول في نفس الجلسة، ادخل مباشرة
if (sessionStorage.getItem('maherAuthed') === '1') { $('gate').hidden = true; }

/* --- جلب البيانات --- */
async function load(){
  try {
    const res = await fetch(API, { headers: { 'x-admin-key': ADMIN_KEY } });
    if (!res.ok) throw new Error('status '+res.status);
    const data = await res.json();
    ALL = data.rows || [];
  } catch (e) {
    // تعذّر الاتصال — استخدم البيانات التجريبية
    ALL = DEMO;
    console.info('وضع المعاينة: بيانات تجريبية (لا يوجد خادم متصل)');
  }
  render();
}
if (sessionStorage.getItem('maherAuthed') === '1') load();

/* --- التصفية + العرض --- */
$('refreshBtn').addEventListener('click', load);
$('exportBtn').addEventListener('click', exportExcel);
$('searchInput').addEventListener('input', render);
$('programFilter').addEventListener('change', render);
$('batchFilter').addEventListener('change', render);
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
    t.classList.add('on');
    filterGender = t.dataset.g;
    render();
  });
});

function currentRows(){
  const q = $('searchInput').value.trim().toLowerCase();
  const prog = $('programFilter').value;
  const batch = $('batchFilter').value;
  return ALL.filter(r=>{
    if (filterGender !== 'all' && r.gender !== filterGender) return false;
    if (prog && r.program !== prog) return false;
    if (batch && r.batch !== batch) return false;
    if (q){
      const hay = [r.first_name,r.last_name,r.email,r.phone,r.city,r.country].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function render(){
  const males = ALL.filter(r=>r.gender==='ذكر').length;
  const females = ALL.filter(r=>r.gender==='أنثى').length;
  const today = new Date().toISOString().slice(0,10);
  const todayCount = ALL.filter(r=>(r.created_at||'').slice(0,10)===today).length;

  $('stTotal').textContent = ALL.length;
  $('stMale').textContent = males;
  $('stFemale').textContent = females;
  $('stToday').textContent = todayCount;
  $('cAll').textContent = ALL.length;
  $('cMale').textContent = males;
  $('cFemale').textContent = females;
  const tot = males+females || 1;
  $('barM').style.width = (males/tot*100)+'%';
  $('barF').style.width = (females/tot*100)+'%';

  // إحصاءات حسب البرنامج
  const progs = {};
  ALL.forEach(r=>{ const p=r.program||'غير محدد'; progs[p]=(progs[p]||0)+1; });
  $('progStats').innerHTML = Object.keys(progs).map(p=>
    `<div class="prog-chip"><b>${esc(p)}</b><span class="num">${progs[p]}</span></div>`).join('');

  const rows = currentRows();
  const tb = $('tbody');
  tb.innerHTML = '';
  $('emptyState').hidden = rows.length !== 0;

  rows.forEach(r=>{
    const isM = r.gender==='ذكر';
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${r.id ?? ''}</td>
      <td>${esc(r.first_name)} ${esc(r.last_name)}</td>
      <td><span class="g-pill ${isM?'m':'f'}"><span class="d"></span>${esc(r.gender)}</span></td>
      <td class="hide-sm">${r.age ?? ''}</td>
      <td class="hide-sm">${esc(r.program||'')}</td>
      <td class="hide-sm">${esc(r.batch||'')}</td>
      <td class="hide-sm">${esc(r.country||'')} — ${esc(r.city||'')}</td>
      <td class="ltr copy" data-copy="${esc(r.phone||'')}" title="نسخ">${esc(r.phone||'')}</td>
      <td class="hide-sm ltr copy" data-copy="${esc(r.email||'')}" title="نسخ">${esc(r.email||'')}</td>
      <td class="hide-sm">${fmtDate(r.created_at)}</td>
      <td><button class="del-btn" data-del="${r.id}">حذف</button></td>`;
    tb.appendChild(tr);
  });

  // نسخ بالضغط
  tb.querySelectorAll('.copy').forEach(c=>{
    c.addEventListener('click', ()=>{
      const v = c.dataset.copy || '';
      if(!v) return;
      navigator.clipboard?.writeText(v).then(()=>toast('تم النسخ: '+v));
    });
  });
  // حذف مسجّل
  tb.querySelectorAll('.del-btn').forEach(b=>{
    b.addEventListener('click', ()=>delRow(b.dataset.del));
  });
}

let toastT;
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('show'), 2200);
}

async function delRow(id){
  if(!confirm('حذف هذا المسجّل نهائيًا؟')) return;
  try{
    const res = await fetch(API + '?id=' + encodeURIComponent(id), {
      method:'DELETE', headers:{ 'x-admin-key': ADMIN_KEY }
    });
    if(!res.ok) throw new Error('status '+res.status);
    ALL = ALL.filter(r=>String(r.id)!==String(id));
    render();
    toast('تم الحذف');
  }catch(e){ toast('تعذّر الحذف'); }
}

function esc(s){ return String(s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmtDate(s){ if(!s) return ''; const d=new Date(s); return isNaN(d)?s:d.toLocaleDateString('ar',{year:'numeric',month:'short',day:'numeric'}); }

/* --- تصدير Excel مرتّب (جدول HTML يفتحه Excel بأعمدة نظيفة RTL) --- */
function exportExcel(){
  const rows = currentRows();
  const cols = [['التاريخ', r=>fmtDate(r.created_at)],
    ['الاسم', r=>r.first_name], ['العائلة', r=>r.last_name],
    ['الجنس', r=>r.gender], ['العمر', r=>r.age],
    ['الهاتف', r=>r.phone], ['البريد', r=>r.email],
    ['الدولة', r=>r.country], ['المدينة', r=>r.city],
    ['البرنامج', r=>r.program], ['الدفعة', r=>r.batch]];
  const head = '<tr>' + cols.map(c=>`<th style="background:#552e93;color:#fff;border:1px solid #999;padding:6px">${c[0]}</th>`).join('') + '</tr>';
  const body = rows.map(r=>'<tr>' + cols.map(c=>{
    const v = esc(String(c[1](r) ?? ''));
    const isNum = c[0]==='العمر';
    return `<td style="border:1px solid #ccc;padding:6px;mso-number-format:'\\@'">${v}</td>`;
  }).join('') + '</tr>').join('');
  const html = `<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="utf-8"></head>`+
    `<body><table dir="rtl" border="1" style="border-collapse:collapse;font-family:Arial">${head}${body}</table></body></html>`;
  const blob = new Blob(['\uFEFF'+html], {type:'application/vnd.ms-excel;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const tag = filterGender==='all' ? 'الكل' : filterGender;
  a.download = `مسجلو-ملتقى-ماهر-${tag}.xls`;
  a.click();
}
</script>
</body>
</html>
