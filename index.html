            <select id="batch" name="batch">
              <option value="" selected>بدون / لا ينطبق</option>
              <option value="الدفعة الأولى">الدفعة الأولى</option>
              <option value="الدفعة الثانية">الدفعة الثانية</option>
              <option value="الدفعة الثالثة">الدفعة الثالثة</option>
            </select>
            <span class="caret">▾</span>
          </div>
        </div>

      </div>

      <label class="pledge" id="pledgeLabel">
        <input type="checkbox" id="pledge" name="pledge">
        <span class="pledge-box" aria-hidden="true"><span class="pledge-tick">✓</span></span>
        <span class="pledge-text">أتعهد بالالتزام بأنظمة الملتقى، والمشاركة الجادة في الأنشطة، والمحافظة على أخلاقيات المنافسة.</span>
      </label>

      <p class="form-error" id="formError"></p>
      <button type="submit" class="submit" id="submitBtn" disabled>إرسال الطلب</button>

    </form>
  </main>

  <!-- ===== شاشة النجاح ===== -->
  <div class="success" id="success" hidden>
    <div class="success-inner">
      <svg viewBox="0 0 120 120" class="success-svg">
        <circle cx="60" cy="60" r="52" fill="none" stroke="rgba(231,215,242,0.16)" stroke-width="4"></circle>
        <circle class="s-circle" cx="60" cy="60" r="52" fill="none" stroke="#e7d7f2" stroke-width="4" stroke-linecap="round" stroke-dasharray="327" stroke-dashoffset="327" transform="rotate(-90 60 60)"></circle>
        <path class="s-check" d="M38 61 L53 76 L83 44" fill="none" stroke="#e7d7f2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="70" stroke-dashoffset="70"></path>
      </svg>
      <div class="success-title">تم إرسال بياناتكم بنجاح</div>
      <p class="success-desc">شكرًا لانضمامكم إلى ملتقى ماهر الإلكتروني</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
